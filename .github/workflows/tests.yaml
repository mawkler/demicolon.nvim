name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: extractions/setup-just@v4
      - name: Run tests
        run: just test
